[package]
name = "bevy_lsp"
version = "0.1.0"
edition = "2021"
authors = ["PoHsuanLai"]
license = "MIT OR Apache-2.0"
description = "Text-rendering-agnostic Language Server Protocol integration for Bevy: JSON-RPC transport, request/response routing, document sync state, and capability querying. Suitable for editors, debugger UIs, hot-reload tooling, AI assistants asking an LSP for completions, code search panels, and other LSP-aware tools."
repository = "https://github.com/PoHsuanLai/bevy_code_editor"
keywords = ["bevy", "lsp", "language-server", "tower-lsp"]
categories = ["game-development", "development-tools"]

[dependencies]
# Engine-tier crate: ECS + log only.
# No rendering — this crate is text-rendering-agnostic.
bevy = { version = "0.17", default-features = false, features = [
    "bevy_log",
] }

# LSP protocol types
lsp-types = "0.95"
tower-lsp = "0.20"

# Async runtime — tower-lsp pulls this in transitively, but we depend on it
# directly for the channel/runtime features the spawned reader/writer threads
# use.
tokio = { version = "1.0", features = ["sync", "rt"] }

# JSON-RPC serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Fuzzy matching for client-side completion filtering
fuzzy-matcher = "0.3"

# Rope for word-extraction in completion fallback
ropey = "1.6"
