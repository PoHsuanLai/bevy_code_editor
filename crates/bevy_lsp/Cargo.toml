[package]
name = "bevy_lsp"
version = "0.1.0"
edition = "2021"
authors = ["PoHsuanLai"]
license = "MIT OR Apache-2.0"
description = "Per-entity Language Server Protocol transport for Bevy: JSON-RPC over stdio, request/response routing, server-capability querying, per-document URI/version tracking. Just the protocol — UI state (popups, completion filtering, debouncing) lives in the consumer."
repository = "https://github.com/PoHsuanLai/bevy_code_editor"
keywords = ["bevy", "lsp", "language-server"]
categories = ["game-development", "development-tools"]

[dependencies]
# Engine-tier crate: ECS + log only. No rendering, no async runtime — the
# transport uses std::thread + std::sync::mpsc.
bevy = { version = "0.17", default-features = false, features = [
    "bevy_log",
] }

# LSP protocol types
lsp-types = "0.95"

# JSON-RPC serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
