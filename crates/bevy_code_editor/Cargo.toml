[package]
name = "bevy_code_editor"
version = "0.1.0"
edition = "2021"
authors = ["PoHsuanLai"]
license = "MIT OR Apache-2.0"
description = "High-performance GPU-accelerated code editor plugin for Bevy"
repository = "https://github.com/PoHsuanLai/bevy_code_editor"
keywords = ["bevy", "editor", "code-editor", "syntax-highlighting"]
categories = ["game-development", "text-editors"]

[dependencies]
bevy_instanced_text = { path = "../bevy_instanced_text" }
bevy_instanced_text_edit = { path = "../bevy_instanced_text_edit" }
bevy_tree_sitter = { path = "../bevy_tree_sitter", optional = true }
bevy_lsp = { path = "../bevy_lsp", optional = true }

bevy = { version = "0.18", default-features = false, features = [
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_asset",
    "bevy_text",
    "default_font",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_color",
    "bevy_mesh",
    "bevy_camera",
    "bevy_input_focus",
    "bevy_picking",
] }
bevy_camera = "0.18"

ropey = "1.6"
serde = { version = "1.0", features = ["derive"] }
leafwing-input-manager = { version = "0.20", features = ["keyboard"] }
cosmic-text = "0.12"
swash = "0.1"
bytemuck = { version = "1.14", features = ["derive"] }
arboard = { version = "3.4" }
lsp-types = { version = "0.95", optional = true }
serde_json = { version = "1.0", optional = true }
fuzzy-matcher = { version = "0.3", optional = true }

[dev-dependencies]
bevy = { version = "0.18", features = ["bevy_window", "bevy_winit"] }

[features]
default = ["tree-sitter"]

tree-sitter = ["dep:bevy_tree_sitter"]
lsp = ["dep:bevy_lsp", "lsp-types", "serde_json", "fuzzy-matcher"]
# Dynamic linking for fast dev iteration (not for release builds)
dynamic_linking = ["bevy/dynamic_linking"]
# Tracy-based performance profiling
profile = ["bevy/trace", "bevy/trace_tracy"]

