[package]
name = "bevsterm"
version = "0.1.0"
edition = "2021"
authors = ["PoHsuanLai"]
license = "MIT OR Apache-2.0"
readme = "README.md"
description = "Embeddable terminal widget for Bevy. PTY + VT parser via wezterm-term; rendering via bevy_instanced_text; selection and clipboard via bevy_text_interaction."
repository = "https://github.com/PoHsuanLai/bevscode"
keywords = ["bevy", "terminal", "pty", "vt100", "wezterm"]
categories = ["game-development", "command-line-interface"]
# wezterm-term and wezterm-surface are not published to crates.io (wezterm/wezterm#6663).
# Remove this once they are available as versioned crates.
publish = false

[dependencies]
bevy_instanced_text = { path = "../bevy_instanced_text" }
bevy_text_interaction = { path = "../bevy_text_interaction", default-features = false }

bevy = { version = "0.18", default-features = false, features = [
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_asset",
    "bevy_text",
    "default_font",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_color",
    "bevy_mesh",
    "bevy_camera",
    "bevy_input_focus",
    "bevy_picking",
    "bevy_ui",
    "bevy_window",
] }

# Pinned commit — wezterm-term does not guarantee a stable public API.
# All wezterm imports are isolated to `crate::backend` to contain future bumps.
wezterm-term = { git = "https://github.com/wezterm/wezterm", rev = "577474d89ee61aef4a48145cdec82a638d874751" }
wezterm-surface = { git = "https://github.com/wezterm/wezterm", rev = "577474d89ee61aef4a48145cdec82a638d874751" }
termwiz = { git = "https://github.com/wezterm/wezterm", rev = "577474d89ee61aef4a48145cdec82a638d874751" }

portable-pty = { version = "0.9", optional = true }
crossbeam-channel = "0.5"
parking_lot = "0.12"

leafwing-input-manager = "0.20"

serde = { version = "1.0", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
bevy = { version = "0.18", features = ["bevy_window", "bevy_winit"] }
bevscode = { path = "../bevscode" }

[features]
default = ["arboard", "pty"]
# Native PTY backend (portable-pty). Disable for WASM / headless builds and
# add `BevyTerminalPlugin` only; supply your own `TerminalSession` +
# `TerminalEventChannel` (e.g. backed by a WebSocket).
pty = ["dep:portable-pty"]
# `arboard`-backed clipboard. Disable for headless/web builds and inject your
# own `ClipboardProvider` via `insert_resource(ClipboardResource::new(...))`.
arboard = ["bevy_text_interaction/arboard"]
# Tracy-based performance profiling
profile = ["bevy/trace", "bevy/trace_tracy"]
