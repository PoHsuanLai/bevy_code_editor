[package]
name = "bevy_text_editor"
version = "0.1.0"
edition = "2021"
authors = ["PoHsuanLai"]
license = "MIT OR Apache-2.0"
description = "Editable text widget for Bevy: pointer interaction, selection, cursor, edit history, undo/redo, clipboard — built on bevy_text_engine."
repository = "https://github.com/PoHsuanLai/bevy_code_editor"
keywords = ["bevy", "text", "editor", "input", "selection"]
categories = ["game-development"]

[dependencies]
# Text rendering primitives (TextView, TextViewState, TextViewViewport, FontConfig).
bevy_text_engine = { path = "../bevy_text_engine" }

# Match the editor's bevy feature set so this crate composes cleanly with it.
bevy = { version = "0.18", default-features = false, features = [
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_asset",
    "bevy_text",
    "default_font",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_color",
    "bevy_mesh",
    "bevy_camera",
    "bevy_input_focus",
    "bevy_picking",
] }

ropey = "1.6"
arboard = "3.4"
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
bevy = { version = "0.18", features = ["bevy_window", "bevy_winit"] }

