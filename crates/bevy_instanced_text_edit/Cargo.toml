[package]
name = "bevy_instanced_text_edit"
version = "0.1.0"
edition = "2021"
authors = ["PoHsuanLai"]
license = "MIT OR Apache-2.0"
readme = "README.md"
description = "Editable text widget for Bevy: pointer interaction, selection, cursor, edit history, undo/redo, clipboard — built on bevy_instanced_text."
repository = "https://github.com/PoHsuanLai/bevscode"
keywords = ["bevy", "text", "editor", "input", "selection"]
categories = ["game-development"]

[features]
default = ["arboard"]
# `arboard`-backed `SystemClipboard` (the default `ClipboardResource`
# implementation). The `ClipboardProvider` trait + `ClipboardResource`
# are always available; this flag only gates whether `arboard` is the
# default backend. Disable for headless / web / sandboxed builds and
# substitute your own provider via
# `insert_resource(ClipboardResource::new(...))`.
arboard = ["dep:arboard"]

[dependencies]
# Text rendering primitives (TextView, TextBuffer, ScrollState, TextViewViewport, FontConfig).
bevy_instanced_text = { path = "../bevy_instanced_text", version = "0.1.0" }

# Match the editor's bevy feature set so this crate composes cleanly with it.
bevy = { version = "0.18", default-features = false, features = [
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_asset",
    "bevy_text",
    "default_font",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_color",
    "bevy_mesh",
    "bevy_camera",
    "bevy_input_focus",
    "bevy_picking",
] }

ropey = "1.6"
arboard = { version = "3.4", optional = true }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
bevy = { version = "0.18", features = ["bevy_window", "bevy_winit"] }

