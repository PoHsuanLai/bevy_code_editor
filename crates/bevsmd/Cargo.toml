[package]
name = "bevsmd"
version = "0.1.0"
edition = "2021"
authors = ["PoHsuanLai"]
license = "MIT OR Apache-2.0"
readme = "README.md"
description = "Read-only markdown viewer plugin for Bevy. Parses CommonMark with pulldown-cmark and renders rich text (headings, bold, italic, code blocks, lists, links) via bevy_instanced_text."
repository = "https://github.com/PoHsuanLai/bevscode"
keywords = ["bevy", "markdown", "text", "rendering", "viewer"]
categories = ["game-development", "rendering", "text-processing"]

[dependencies]
bevy = { version = "0.18", default-features = false, features = [
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_asset",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_color",
    "bevy_mesh",
    "bevy_camera",
    "bevy_log",
    "bevy_text",
] }
bevy_instanced_text = { path = "../bevy_instanced_text", version = "0.1.0" }
pulldown-cmark = { version = "0.12", default-features = false }
ropey = "1.6"

# Optional tree-sitter syntax highlighting for fenced code blocks.
bevy_tree_sitter = { path = "../bevy_tree_sitter", version = "0.1.0", optional = true }
tree-sitter-rust = { version = "0.23", optional = true }
tree-sitter-c = { version = "0.23", optional = true }

[features]
tree-sitter = ["dep:bevy_tree_sitter", "dep:tree-sitter-rust", "dep:tree-sitter-c"]

[dev-dependencies]
bevy = { version = "0.18", features = ["bevy_window", "bevy_winit", "default_font"] }
