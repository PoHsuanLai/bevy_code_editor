[package]
name = "bevy_terminal"
version = "0.1.0"
edition = "2021"
authors = ["PoHsuanLai"]
license = "MIT OR Apache-2.0"
description = "Embeddable terminal widget for Bevy. PTY + VT parser via wezterm-term; rendering via bevy_text_engine; selection and clipboard via bevy_text_editor."
repository = "https://github.com/PoHsuanLai/bevy_code_editor"
keywords = ["bevy", "terminal", "pty", "vt100", "wezterm"]
categories = ["game-development", "command-line-interface"]

[dependencies]
bevy_text_engine = { path = "../bevy_text_engine" }
bevy_text_editor = { path = "../bevy_text_editor" }

bevy = { version = "0.18", default-features = false, features = [
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_asset",
    "bevy_text",
    "default_font",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_color",
    "bevy_mesh",
    "bevy_camera",
    "bevy_input_focus",
    "bevy_picking",
    "bevy_window",
] }

# Terminal state machine + VT parser. MIT. Pinned to a specific upstream
# commit; wezterm-term explicitly does not promise a stable public API
# (https://github.com/wezterm/wezterm/issues/6663). All wezterm imports
# in the crate go through `crate::backend`, so a future bump or fork
# touches one file rather than many.
wezterm-term = { git = "https://github.com/wezterm/wezterm", rev = "577474d89ee61aef4a48145cdec82a638d874751" }
wezterm-surface = { git = "https://github.com/wezterm/wezterm", rev = "577474d89ee61aef4a48145cdec82a638d874751" }
termwiz = { git = "https://github.com/wezterm/wezterm", rev = "577474d89ee61aef4a48145cdec82a638d874751" }

# Cross-platform PTY allocation + child-process spawning. Replaces the
# tty + EventLoop machinery that came with alacritty_terminal.
portable-pty = "0.9"

# crossbeam for the PTY-reader-thread → ECS bytes bridge. (Same crate we
# used with alacritty's EventLoop — only the payload type changes:
# parsed events → raw byte chunks.)
crossbeam-channel = "0.5"

# parking_lot::Mutex for the Terminal handle. Avoids depending on
# alacritty_terminal's re-export of FairMutex now that the crate is gone.
parking_lot = "0.12"

leafwing-input-manager = "0.20"

ropey = "1.6"
serde = { version = "1.0", features = ["derive"] }
arboard = "3.4"

[dev-dependencies]
bevy = { version = "0.18", features = ["bevy_window", "bevy_winit"] }
bevy_code_editor = { path = "../bevy_code_editor" }
