[package]
name = "examples"
version = "0.0.0"
edition = "2021"
publish = false
description = "Workspace examples for the bevscode family of crates."

[dependencies]
bevy = { version = "0.18", default-features = false, features = [
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_asset",
    "bevy_text",
    "default_font",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_color",
    "bevy_mesh",
    "bevy_camera",
    "bevy_input_focus",
    "bevy_picking",
    "bevy_ui",
    "bevy_window",
    "bevy_winit",
    "bevy_log",
    "multi_threaded",
] }
bevy_camera = "0.18"

bevy_instanced_text = { path = "../crates/bevy_instanced_text" }
bevy_instanced_text_edit = { path = "../crates/bevy_instanced_text_edit" }
bevscode = { path = "../crates/bevscode" }
bevsterm = { path = "../crates/bevsterm" }
bevy_tree_sitter = { path = "../crates/bevy_tree_sitter", optional = true }
bevy_lsp = { path = "../crates/bevy_lsp", optional = true }

# Used by editor_perf / editor_syntax for syntax highlighting.
tree-sitter-rust = "0.23"
tree-sitter-c = "0.23"

# Used by editor_lsp.
bevy_egui = { version = "0.39", features = ["picking"], optional = true }
armas = { git = "https://github.com/PoHsuanLai/Armas.git", default-features = false, features = ["basic"], optional = true }
lsp-types = { version = "0.95", optional = true }

[features]
default = ["tree-sitter"]

# Tree-sitter syntax highlighting for the editor examples.
tree-sitter = [
    "dep:bevy_tree_sitter",
    "bevscode/tree-sitter",
]

# LSP example. Requires `rust-analyzer` on PATH at run time.
lsp = [
    "dep:bevy_lsp",
    "dep:bevy_egui",
    "dep:armas",
    "dep:lsp-types",
    "bevscode/lsp",
    "tree-sitter",
]

# Tracy-based performance profiling with named system spans
profile = [
    "bevscode/profile",
    "bevsterm/profile",
    "bevy/trace",
    "bevy/trace_tracy",
    "bevy/debug",
]

[[example]]
name = "editor"
path = "editor.rs"


[[example]]
name = "editor_perf"
path = "editor_perf.rs"

[[example]]
name = "editor_multi"
path = "editor_multi.rs"

[[example]]
name = "text_view"
path = "text_view.rs"

[[example]]
name = "editor_syntax"
path = "editor_syntax.rs"
required-features = ["tree-sitter"]

[[example]]
name = "editor_lsp"
path = "editor_lsp.rs"
required-features = ["lsp"]

[[example]]
name = "terminal"
path = "terminal.rs"

[[example]]
name = "terminal_editor"
path = "terminal_editor.rs"

[[example]]
name = "text_input"
path = "text_input.rs"

