[workspace]
resolver = "2"
members = [
    "crates/bevscode",
    "crates/bevy_lsp",
    "crates/bevsterm",
    "crates/bevy_instanced_text_editor",
    "crates/bevy_markdown",
    "crates/bevy_tree_sitter",
    "examples",
    "examples/wasm_lsp",
]
# bevy_resvg has no Bevy-0.19 release; we vendor a 0.19-ported copy under
# vendor/ and patch it in below. It keeps its own workspace, so exclude it.
exclude = ["vendor"]

[profile.release]
debug = true

[workspace.dependencies]
# Bevy. Features stay per-crate; default-features = false everywhere.
bevy = { version = "0.19", default-features = false }
bevy_app = "0.19"
bevy_ecs = "0.19"
bevy_log = "0.19"
bevy_tasks = "0.19"
bevy_camera = "0.19"

# In-workspace bevy_instanced_text family.
bevy_instanced_text = { git = "https://github.com/PoHsuanLai/bevy_instanced_text.git", rev = "81026c6" }
bevy_instanced_text_interaction = { git = "https://github.com/PoHsuanLai/bevy_instanced_text.git", rev = "81026c6", default-features = false }

# Shared third-party crates with 2+ callers.
ropey = "1.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# 0.21 is the first release built against Bevy 0.19; 0.20 targets Bevy 0.18.
leafwing-input-manager = "0.21"
lsp-types = "0.95"

# Wezterm trio — must stay on the same git rev. Pinned commit, isolated to
# bevsterm::backend; bumping this is a coordinated change.
wezterm-term = { git = "https://github.com/wezterm/wezterm", rev = "577474d89ee61aef4a48145cdec82a638d874751" }
wezterm-surface = { git = "https://github.com/wezterm/wezterm", rev = "577474d89ee61aef4a48145cdec82a638d874751" }
termwiz = { git = "https://github.com/wezterm/wezterm", rev = "577474d89ee61aef4a48145cdec82a638d874751" }

# bevy_resvg 2.3.3 (crates.io latest) targets Bevy 0.18; no upstream 0.19
# release exists. Redirect to the vendored, 0.19-ported copy under vendor/.
# Drop once an upstream Bevy-0.19 bevy_resvg is published.
# (tempera and bevy_ui_text_input no longer need patches — their own repos
#  are now on Bevy 0.19 and bevscode pins those 0.19 revisions directly.)
[patch.crates-io]
bevy_resvg = { path = "vendor/bevy_resvg" }
